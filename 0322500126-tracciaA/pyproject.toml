[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vancotwin"
version = "1.0.0"
description = "Digital Twin farmacocinetico della vancomicina: ODE, calibrazione bayesiana (PyMC), EnKF e scenari terapeutici"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: test che eseguono il campionamento MCMC"]
